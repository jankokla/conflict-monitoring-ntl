site_name: Conflict Monitoring - NTL
site_url: https://dummy.org/
extra_css:
  - stylesheets/extra.css

nav:
  - NTL Products:
      - Satellites: analysis/satellites.md
  - Preprocessing:
      - Data Analysis: notebooks/data_analysis.ipynb
      - Precision-Recall: notebooks/precision_recall.ipynb
  - Regional Robustness:
      - Global Overlap: notebooks/bm_ghsl_match.ipynb
      - Urbanisation Level: notebooks/bm_ghsl_smod.ipynb
  - Progress Updates:
      - November: notebooks/progress_update.ipynb

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - toc.integrate
    - navigation.sections
    - content.tooltips
    - content.footnote.tooltips
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

plugins:
  - search
  - macros
  - mkdocs-jupyter:
      remove_tag_config:
        remove_input_tags:
          - hide_code
        remove_all_outputs_tags:
          - hide_output
      include_source: True
  - panzoom
  - d2
  - bibtex:
      bib_file: "docs/refs.bib"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
  - abbr
  - attr_list
  - pymdownx.snippets
  - footnotes
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
